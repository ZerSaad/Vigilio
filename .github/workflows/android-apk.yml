name: Construire l'APK Vigilio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les dépendances
        run: npm ci
      - name: Préparer les modèles de détection
        run: npm run assets
      - name: Vérifier les tests
        run: npm test
      - name: Construire et synchroniser Android
        run: npm run android:sync
      - name: Installer le SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Générer l'APK de test
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Vigilio-test.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Vigilio-APK
          path: Vigilio-test.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
